tags:
  - Contacts
summary: Delete contact
operationId: deleteContact
description: 'Delete contact by id with payload'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598008'
responses:
  '204':
    description: 'Delete contact'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 204
            message:
              type: string
              example: Successfully found contact with id 65ca67e7ae7f10c88b598008!
            data:
              type: object
              $ref: '../../../components/schemas/contact.yaml'
  # '401':
  #   $ref: '../../../components/responses/401.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'